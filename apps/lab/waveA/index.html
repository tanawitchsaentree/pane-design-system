<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Wave A: ButtonGroup and SplitButton, three ways each</title>
<style>
  body { margin: 0; padding: 48px; background: #0B0B0D; color: #fff; font: 15px/1.5 system-ui, sans-serif; }
  section { margin-block-end: 36px; } .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .pane { padding: 16px; border-radius: 22px; background: linear-gradient(180deg, #2a2b30, #1c1d21); box-shadow: inset 0 1px 0 #fff2; }
  .b { display: inline-block; padding: 10px 16px; background: linear-gradient(180deg,#ffffff24,#ffffff10); box-shadow: inset 0 1px 0 #fff3; }
  .l { background: #fff; color: #000; } figcaption { margin-top: 8px; color: #ffffffcc; font-size: 13px; }
</style></head><body>
<h1>ButtonGroup and SplitButton (Pane)</h1>
<section><h2>ButtonGroup</h2><div class="row">
 <figure><div class="pane"><span class="b" style="border-radius:22px 6px 6px 22px">Bold</span><span class="b" style="margin-left:1px;border-radius:6px">Italic</span><span class="b" style="margin-left:1px;border-radius:6px 22px 22px 6px">Underline</span></div><figcaption><b>A · hairline seam, squared inner corners</b> (picked)</figcaption></figure>
 <figure><div class="pane"><span style="display:inline-flex;border:1px solid #888;border-radius:8px"><span style="padding:10px 16px;border-right:1px solid #888">Bold</span><span style="padding:10px 16px;border-right:1px solid #888">Italic</span><span style="padding:10px 16px">Underline</span></span></div><figcaption>B · bordered box with dividers</figcaption></figure>
 <figure><div class="pane"><span class="b" style="border-radius:22px 0 0 22px">Bold</span><span class="b" style="border-radius:0">Italic</span><span class="b" style="border-radius:0 22px 22px 0">Underline</span></div><figcaption>C · touching, no seam</figcaption></figure>
</div></section>
<section><h2>SplitButton</h2><div class="row">
 <figure><div class="pane"><span class="b l" style="border-radius:22px 6px 6px 22px">Save</span><span class="b l" style="margin-left:1px;border-radius:6px 22px 22px 6px">⌄</span></div><figcaption><b>A · one variant, joined</b> (picked)</figcaption></figure>
 <figure><div class="pane"><span class="b" style="background:#2a6ef0;border-radius:22px 0 0 22px">Save</span><span class="b" style="background:#666;border-radius:0 22px 22px 0">⌄</span></div><figcaption>B · coloured main half, grey arrow</figcaption></figure>
 <figure><div class="pane"><span class="b" style="border-radius:22px">Save options ⌄</span></div><figcaption>C · a menu button only</figcaption></figure>
</div></section>
</body></html>
