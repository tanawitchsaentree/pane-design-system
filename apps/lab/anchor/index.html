<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor round — glass profile card × 4</title>
<link rel="stylesheet" href="anchor.css">
</head>
<body data-scene="room">
<div class="env" aria-hidden="true"><i class="e1"></i><i class="e2"></i><i class="e3"></i><i class="e4"></i><i class="e5"></i></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-verified" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5l2.6 2 3.3-.3 1 3.1 2.8 1.8-1.1 3.1 1.1 3.1-2.8 1.8-1 3.1-3.3-.3-2.6 2-2.6-2-3.3.3-1-3.1-2.8-1.8 1.1-3.1-1.1-3.1 2.8-1.8 1-3.1 3.3.3z"/><path fill="none" stroke="var(--verified-tick, #000)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M8 12.2l2.7 2.6L16.2 9"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 20l4.5-1 10-10a2.1 2.1 0 00-3-3l-10 10L4 20z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0113 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path stroke="currentColor" stroke-width="1.7" d="M4 10h16M9 3.5v4M15 3.5v4"/></symbol>
  <symbol id="i-reply" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M4.5 11.5a7 7 0 017-7h1a7 7 0 010 14H9l-4 3v-4.5a7 7 0 01-.5-2.5z"/></symbol>
  <symbol id="i-repost" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M7 4L4 7l3 3M4 7h11a4 4 0 014 4v1M17 20l3-3-3-3M20 17H9a4 4 0 01-4-4v-1"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0112 7.4 4.3 4.3 0 0119.5 10c0 5.4-7.5 10-7.5 10z"/></symbol>
  <symbol id="i-views" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M5 19V12M10 19V6M15 19v-9M20 19v-4"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 15V4M8 8l4-4 4 4M6 12v6a2 2 0 002 2h8a2 2 0 002-2v-6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></g></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M3 12h17M15 7l5 5-5 5"/></symbol>
</svg>

<header class="bar">
  <div class="bar-title">
    <strong>Anchor round · glass profile card</strong>
    <span>Same content, four treatments. Pick one as the seed for the system.</span>
  </div>
  <div class="bar-group" role="group" aria-label="Backdrop">
    <span class="bar-label">Backdrop</span>
    <button type="button" data-scene-btn="room" aria-pressed="true">Room</button>
    <button type="button" data-scene-btn="blobs" aria-pressed="false">Soft blobs</button>
    <button type="button" data-scene-btn="night" aria-pressed="false">Night</button>
    <button type="button" data-scene-btn="daylight" aria-pressed="false">Daylight</button>
  </div>
</header>

<main class="grid" id="grid"></main>

<template id="card">
  <article class="card">
    <div class="cover">
      <button class="icon-btn edit" type="button" aria-label="Edit profile"><svg><use href="#i-pencil"/></svg></button>
    </div>
    <div class="id">
      <div class="avatar lg" aria-hidden="true">MF</div>
      <div class="who">
        <h3>Max Fmz <svg class="verified" aria-label="Verified"><use href="#i-verified"/></svg></h3>
        <span class="handle">@bymxfmz</span>
      </div>
    </div>
    <p class="bio">UX/UI Designer. Outdoor enthusiast. Coffee lover.</p>
    <ul class="meta">
      <li><svg aria-hidden="true"><use href="#i-pin"/></svg>Switzerland</li>
      <li><svg aria-hidden="true"><use href="#i-link"/></svg>mfz.framer.website</li>
      <li><svg aria-hidden="true"><use href="#i-cal"/></svg>Joined June 2023</li>
    </ul>
    <p class="stats"><b>1.6M</b> Following <span aria-hidden="true">·</span> <b>99</b> Followers</p>
    <div class="tabs" role="tablist" aria-label="Profile sections">
      <button role="tab" aria-selected="true" type="button">Tweets</button>
      <button role="tab" aria-selected="false" type="button">Replies</button>
      <button role="tab" aria-selected="false" type="button">Media</button>
      <button role="tab" aria-selected="false" type="button">Likes</button>
    </div>
    <article class="post">
      <header class="post-head">
        <div class="avatar sm brand" aria-hidden="true">V</div>
        <b>Visual Flow</b><svg class="verified sm" aria-label="Verified"><use href="#i-verified"/></svg>
        <span class="handle">@visualflow · 9h</span>
        <button class="icon-btn more" type="button" aria-label="More"><svg><use href="#i-more"/></svg></button>
      </header>
      <p class="post-body">Say goodbye to flat feeds. Asset 05 is live — designed for modern visual projects.</p>
      <div class="media">
        <span class="media-tag">Visual asset 05</span>
        <span class="media-num">07</span>
        <span class="media-cap"><svg aria-hidden="true"><use href="#i-arrow"/></svg>Designed for modern visual projects</span>
      </div>
      <footer class="actions">
        <span><svg aria-hidden="true"><use href="#i-reply"/></svg>268</span>
        <span><svg aria-hidden="true"><use href="#i-repost"/></svg>839</span>
        <span><svg aria-hidden="true"><use href="#i-heart"/></svg>6,707</span>
        <span><svg aria-hidden="true"><use href="#i-views"/></svg>1.7M</span>
        <button class="icon-btn share" type="button" aria-label="Share"><svg><use href="#i-share"/></svg></button>
      </footer>
    </article>
    <button class="cta" type="button">Follow</button>
  </article>
</template>

<script>
const VARIANTS = [
  { id: 'A', cls: 'v-spatial', name: 'A · Spatial', note: 'visionOS-style neutral grey glass, white type, blue selection pill, no borders. Closest to ref 1.' },
  { id: 'B', cls: 'v-milk', name: 'B · Milk frost', note: 'Light milky glass that lets colour through, oversized display numerals, outlined pill tags. Closest to ref 2.' },
  { id: 'C', cls: 'v-smoke', name: 'C · Smoked', note: 'Dark tinted glass with a specular rim — keeps the spatial look and reads best of the four; still short on light backdrops (see numbers).' },
  { id: 'D', cls: 'v-depth', name: 'D · Layered depth', note: 'Glass sheets stacked in Z: raised post sheet, recessed tab track, slight spatial tilt.' },
];
const ROUND = new URLSearchParams(location.search).get('round');
if (ROUND === 'tune') {
  VARIANTS.length = 0;
  VARIANTS.push(
    { id: 'A0', cls: 'v-spatial', name: 'A0 · as picked', note: 'Your pick, unchanged: grey glass rgba(118,118,128,.32), Twitter blue tab.' },
    { id: 'A1', cls: 'v-spatial v-a-tuned v-a1', name: 'A1 · adaptive glass', note: 'Closest to your pick in dim scenes; the glass darkens as the environment gets brighter (the app declares its environment, sized for its brightest spot). Darker blue tab, ringed tabs.' },
    { id: 'A2', cls: 'v-spatial v-a-tuned v-a2', name: 'A2 · one dark glass', note: 'A single darker glass rgba(44,44,52,.82) on every backdrop. Darker blue tab, ringed tabs.' },
  );
  document.querySelector('.bar-title strong').textContent = 'Anchor A · tuning round';
  document.querySelector('.bar-title span').textContent = 'A0 is your pick. A1 and A2 are the two ways the measurements allow it to pass.';
}
const grid = document.getElementById('grid');
const tpl = document.getElementById('card');
let evidence = null;

for (const v of VARIANTS) {
  const col = document.createElement('section');
  col.className = 'col';
  col.setAttribute('aria-label', v.name);
  const card = tpl.content.firstElementChild.cloneNode(true);
  card.classList.add(...v.cls.split(' '));
  card.dataset.group = v.id;
  card.querySelector('.media').dataset.group = `${v.id}-media`; // text on the image is scored on its own
  const cap = document.createElement('div');
  cap.className = 'caption';
  cap.innerHTML = `<strong>${v.name}</strong><span>${v.note}</span><span class="measure" data-measure="${v.id}">contrast: not measured yet</span>`;
  col.append(card, cap);
  grid.append(col);
}

function paintEvidence() {
  const scene = document.body.dataset.scene;
  for (const el of document.querySelectorAll('[data-measure]')) {
    const r = evidence?.scenes?.[scene]?.[el.dataset.measure];
    const m = evidence?.scenes?.[scene]?.[`${el.dataset.measure}-media`];
    el.textContent = r
      ? `measured on ${scene} — card: worst ${r.worst}:1, ${r.below45}/${r.texts} texts below 4.5:1 · on image: worst ${m?.worst ?? '—'}:1`
      : 'contrast: not measured yet';
    el.dataset.ok = r ? String(r.below45 === 0) : '';
  }
}

for (const b of document.querySelectorAll('[data-scene-btn]')) {
  b.addEventListener('click', () => {
    document.body.dataset.scene = b.dataset.sceneBtn;
    for (const o of document.querySelectorAll('[data-scene-btn]')) o.setAttribute('aria-pressed', String(o === b));
    paintEvidence();
  });
}
// Tabs inside each card switch for real, so the selected state can be judged by hand.
grid.addEventListener('click', (e) => {
  const tab = e.target.closest('[role="tab"]');
  if (!tab) return;
  for (const t of tab.parentElement.children) t.setAttribute('aria-selected', String(t === tab));
});
const q = new URLSearchParams(location.search).get('scene');
if (q) document.querySelector(`[data-scene-btn="${q}"]`)?.click();
fetch(ROUND === 'tune' ? 'anchor-evidence-tune.json' : 'anchor-evidence.json').then((r) => (r.ok ? r.json() : null)).then((j) => { evidence = j; paintEvidence(); }).catch(() => {});
</script>
</body>
</html>
