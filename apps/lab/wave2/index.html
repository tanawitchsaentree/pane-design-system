<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Wave 2: Link, Spinner, Skeleton, Kbd, Image</title>
<style>
  body { margin: 0; padding: 48px; background: #0B0B0D; color: #fff; font: 15px/1.5 system-ui, sans-serif; }
  section { margin-block-end: 40px; } .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .pane { padding: 22px; border-radius: 28px; background: linear-gradient(180deg, #2a2b30, #1c1d21); box-shadow: inset 0 1px 0 #ffffff1f; min-height: 80px; }
  figcaption { margin-top: 10px; color: #ffffffcc; font-size: 13px; }
  .ring { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 2px #ffffff29; border-top: 2px solid #fff; }
  .dots { letter-spacing: 6px; font-weight: 700; } .disc { width: 24px; height: 24px; border-radius: 50%; background: #fff; opacity: .5; }
  .sk { height: 15px; border-radius: 99px; background: #0000005a; box-shadow: inset 0 2px 4px #0000008c; margin: 6px 0; }
  .shim { height: 15px; border-radius: 4px; background: linear-gradient(90deg, #555, #777, #555); margin: 6px 0; } .dot { height: 15px; border: 1px dashed #fff8; margin: 6px 0; }
  .cap { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 8px; border-radius: 6px; background: linear-gradient(180deg, #ffffff24, #ffffff0d); box-shadow: 0 2px 6px #0007; font-size: 12px; }
  .box { display: inline-block; padding: 0 6px; border: 1px solid #888; border-radius: 4px; font-family: monospace; background: #333; }
  .img { height: 80px; border-radius: 16px; background: #0000005a; }
</style></head><body>
<h1>Wave 2 derivations (Pane)</h1>
<section><h2>Link</h2><div class="row">
  <figure><div class="pane">Read the <u>shipping guide</u> first.</div><figcaption><b>A · underline in text colour (picked)</b></figcaption></figure>
  <figure><div class="pane">Read the <span style="color:#4a9eff">shipping guide</span> first.</div><figcaption>B · blue text</figcaption></figure>
  <figure><div class="pane">Read the <span class="cap">shipping guide</span> first.</div><figcaption>C · pill chip link</figcaption></figure></div></section>
<section><h2>Spinner</h2><div class="row">
  <figure><div class="pane"><div class="ring"></div></div><figcaption><b>A · lit arc in a groove (picked)</b></figcaption></figure>
  <figure><div class="pane"><span class="dots">•••</span></div><figcaption>B · bouncing dots</figcaption></figure>
  <figure><div class="pane"><div class="disc"></div></div><figcaption>C · pulsing disc</figcaption></figure></div></section>
<section><h2>Skeleton</h2><div class="row">
  <figure><div class="pane"><div class="sk"></div><div class="sk" style="width:62%"></div></div><figcaption><b>A · carved recess that breathes (picked)</b></figcaption></figure>
  <figure><div class="pane"><div class="shim"></div><div class="shim" style="width:62%"></div></div><figcaption>B · grey shimmer</figcaption></figure>
  <figure><div class="pane"><div class="dot"></div><div class="dot" style="width:62%"></div></div><figcaption>C · dotted outline</figcaption></figure></div></section>
<section><h2>Kbd</h2><div class="row">
  <figure><div class="pane">Press <span class="cap">⌘</span> <span class="cap">K</span></div><figcaption><b>A · lit keycap (picked)</b></figcaption></figure>
  <figure><div class="pane">Press <span class="box">⌘</span> <span class="box">K</span></div><figcaption>B · bordered box</figcaption></figure>
  <figure><div class="pane">Press <b>⌘ K</b></div><figcaption>C · bold text</figcaption></figure></div></section>
<section><h2>Image</h2><div class="row">
  <figure><div class="pane"><div class="img"></div></div><figcaption><b>A · fade in over the carve (picked)</b></figcaption></figure>
  <figure><div class="pane"><div class="img" style="background:#fff"></div></div><figcaption>B · pop in (white box first)</figcaption></figure>
  <figure><div class="pane"><div class="img" style="filter:blur(6px);background:#557"></div></div><figcaption>C · blur up</figcaption></figure></div></section>
</body></html>
