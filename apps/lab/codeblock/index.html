<!doctype html><html><head><meta charset="utf-8"><title>CodeBlock · lab</title>
<style>body{margin:0;padding:24px;background:#0b0c0e;color:#fff;font:14px/1.5 -apple-system,system-ui}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{border-radius:28px;padding:20px;background:#24252B73;box-shadow:inset 0 1px 0 #fff3}.b{border-radius:18px;overflow:hidden}.bar{display:flex;justify-content:space-between;padding:6px 6px 6px 16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a7abb8}
pre{margin:0;padding:16px 22px;font:13px/1.6 'SF Mono',ui-monospace,monospace}.k{color:#C4A6FF}.s{color:#9BE3A6}.f{color:#8CC8FF}.t{color:#7FD6E8}.c{color:#8C91A1;font-style:italic}
.A{background:#16171C;box-shadow:inset 0 0 0 1px #ffffff1a}.B{background:#ffffff0d;backdrop-filter:blur(8px)}.C{background:#16171C}.C span{color:inherit!important;font-style:normal}</style></head><body>
<h1 style="font-size:18px">CodeBlock: three grounds</h1><p style="color:#fffb">A an opaque code ground with roles in colour (picked: every role is measured against one colour). B code on the glass itself, roles in colour. C opaque and one colour, like a plain pre.</p>
<div class="row" id="r"></div><script>
const code='<span class="k">import</span> { <span class="t">Button</span> } <span class="k">from</span> <span class="s">\'pane-react\'</span>;\n<span class="c">// one loud action per pane</span>\n<span class="k">export function</span> <span class="f">Save</span>() {}';
document.getElementById('r').innerHTML=['A','B','C'].map(k=>`<div class="card"><div class="b ${k}"><div class="bar"><span>${k} · TSX</span><span>Copy</span></div><pre>${code}</pre></div></div>`).join('');
</script></body></html>
