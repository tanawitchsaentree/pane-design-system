<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Wave 1: Divider, three ways</title>
<style>
  body { margin: 0; padding: 48px; background: #0B0B0D; color: #fff; font: 15px/1.5 system-ui, sans-serif; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .pane { padding: 22px; border-radius: 28px; background: linear-gradient(180deg, #2a2b30, #1c1d21); box-shadow: inset 0 1px 0 #ffffff1f; }
  .pane p { margin: 0; } .gap { height: 14px; }
  .a { height: 2px; background: linear-gradient(180deg, #ffffff29 50%, #ffffff0f 50%); }
  .b { height: 1px; background: #8a8a8f; }
  .c { height: 1px; background: linear-gradient(90deg, transparent, #ffffff40, transparent); }
  figcaption { margin-top: 12px; color: #ffffffcc; }
</style></head><body>
<h1>Divider (Pane, wave 1)</h1>
<div class="row">
  <figure><div class="pane"><p>Profile</p><div class="gap"></div><div class="a"></div><div class="gap"></div><p>Privacy</p></div><figcaption><b>A · etched (picked)</b> shade over light, a groove like every recess.</figcaption></figure>
  <figure><div class="pane"><p>Profile</p><div class="gap"></div><div class="b"></div><div class="gap"></div><p>Privacy</p></div><figcaption><b>B · ink hairline</b> a drawn grey rule; owns a colour.</figcaption></figure>
  <figure><div class="pane"><p>Profile</p><div class="gap"></div><div class="c"></div><div class="gap"></div><p>Privacy</p></div><figcaption><b>C · fading ends</b> soft, but disappears on bright scenes.</figcaption></figure>
</div></body></html>
