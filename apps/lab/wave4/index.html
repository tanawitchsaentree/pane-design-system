<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Wave 4: overlays, three ways each</title>
<style>
  body { margin: 0; padding: 48px; background: #0B0B0D; color: #fff; font: 15px/1.5 system-ui, sans-serif; }
  section { margin-block-end: 40px; } .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .stage { position: relative; height: 180px; border-radius: 24px; overflow: hidden; background: linear-gradient(135deg, #4a5d73, #8a6a4e); }
  .scrim { position: absolute; inset: 0; background: #0009; } .pane { position: absolute; padding: 16px; border-radius: 22px; background: #3a3b40e6; box-shadow: 0 16px 40px #000a, inset 0 1px 0 #fff3; backdrop-filter: blur(20px); }
  .white { background: #fff; color: #111; box-shadow: none; border-radius: 6px; } figcaption { margin-top: 10px; color: #ffffffcc; font-size: 13px; }
</style></head><body>
<h1>Wave 4 derivations (Pane)</h1>
<section><h2>Dialog</h2><div class="row">
 <figure><div class="stage"><div class="scrim"></div><div class="pane" style="inset:40px 50px">Discard draft?</div></div><figcaption><b>A · level-3 pane over a scrim (picked)</b></figcaption></figure>
 <figure><div class="stage"><div class="pane" style="inset:0;border-radius:0">Discard draft?</div></div><figcaption>B · full-screen sheet</figcaption></figure>
 <figure><div class="stage"><div class="pane white" style="inset:60px 20px auto">Discard draft?</div></div><figcaption>C · inline panel</figcaption></figure></div></section>
<section><h2>Sheet, ActionSheet, Snackbar, FAB</h2><div class="row">
 <figure><div class="stage"><div class="scrim"></div><div class="pane" style="inset:auto 0 0;height:90px;border-radius:22px 22px 0 0">⎯ Share</div></div><figcaption><b>A · from the edge (Sheet, picked)</b></figcaption></figure>
 <figure><div class="stage"><div class="scrim"></div><div class="pane" style="inset:auto 12px 60px">Share · Save · <span style="color:#ff8a80">Delete</span></div><div class="pane" style="inset:auto 12px 12px">Cancel</div></div><figcaption><b>ActionSheet A · Cancel apart (picked)</b></figcaption></figure>
 <figure><div class="stage"><div class="pane" style="inset:auto 30px 12px;border-radius:99px;padding:10px 18px">Archived · <b>Undo</b></div><div class="pane" style="inset:12px 12px auto auto;width:48px;height:48px;padding:0;border-radius:50%;background:#fff;box-shadow:0 0 24px #fff6"></div></div><figcaption><b>Snackbar A pill · FAB A loud bead (picked)</b></figcaption></figure></div></section>
<section><h2>Popover, Tooltip, Toast</h2><div class="row">
 <figure><div class="stage"><div class="pane" style="inset:30px auto auto 30px;width:160px">Level 4, no arrow</div></div><figcaption><b>Popover A (picked)</b>; B arrowed box; C inline expansion</figcaption></figure>
 <figure><div class="stage"><div class="pane" style="inset:30px auto auto 30px;padding:6px 12px;border-radius:99px">Share</div></div><figcaption><b>Tooltip A glass pill on hover, focus and tap (picked)</b>; B black box, hover only</figcaption></figure>
 <figure><div class="stage"><div class="pane" style="inset:12px 12px auto auto;width:200px">● Print ordered</div></div><figcaption><b>Toast A level-4 with a status mark (picked)</b>; B colour-filled banner</figcaption></figure></div></section>
</body></html>
