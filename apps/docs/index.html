    <!-- installable (PWA): manifest from scripts/pwa.mjs, the bar colour follows the theme -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#141418" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pane" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Runs before the first paint: the theme is known up front so nothing flips after load, and the
      // demo backdrop photo is requested at once so demo stages are ready when they scroll into view.
      (function () {
        var q = new URLSearchParams(location.search);
        var pref = q.get('theme') || localStorage.getItem('pane-theme') || 'system';
        var theme = pref === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
        var colors = __SCENE_COLORS__;
        var scene = colors[q.get('scene')] ? q.get('scene') : 'room'; // field has no photo to preload
        document.documentElement.dataset.theme = theme;
        var l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = '/scenes/' + scene + '.webp'; l.type = 'image/webp'; l.fetchPriority = 'high';
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
